name: 네이버 쇼핑 브랜드 순위 수집

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      keyword:
        description: '검색 키워드 (예: 모니터, 키보드)'
        required: true
        default: '모니터'
      category:
        description: '카테고리 영문명 (예: monitor, keyboard, tv)'
        required: true
        default: 'monitor'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 브랜드 순위 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          SEARCH_KEYWORD: ${{ github.event.inputs.keyword || '모니터' }}
          SEARCH_CATEGORY: ${{ github.event.inputs.category || 'monitor' }}
        run: node scripts/search.js

      - name: CSV 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: $(date +'%Y-%m-%d') 순위 업데이트"
          git push
